name: Unpack and organize AutoMesh R8.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automesh-r8-unpack
  cancel-in-progress: false

jobs:
  unpack-and-organize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Safely unpack and organize release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, shutil, stat, zipfile
          
          archive = Path('AutoMesh_R8_0_GitHub_Ready.zip')
          if not archive.is_file():
              raise SystemExit('ERROR: source ZIP is missing from repository root.')
          if Path('app/AutoMesh.exe').is_file() and Path('source/main_windows.go').is_file():
              raise SystemExit('ERROR: release already appears to be unpacked; refusing to overwrite.')
          
          with zipfile.ZipFile(archive) as zf:
              infos = zf.infolist()
              if len(infos) > 500:
                  raise SystemExit(f'ERROR: unexpected archive entry count: {len(infos)}')
              total_size = sum(i.file_size for i in infos)
              if total_size > 100 * 1024 * 1024:
                  raise SystemExit(f'ERROR: uncompressed archive exceeds safety limit: {total_size}')
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'ERROR: ZIP CRC validation failed at {bad}')
              extracted = 0
              for info in infos:
                  raw = info.filename
                  rel = PurePosixPath(raw)
                  if rel.is_absolute() or '..' in rel.parts or '\\' in raw:
                      raise SystemExit(f'ERROR: unsafe archive path: {raw}')
                  mode = (info.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f'ERROR: symlink entry is not allowed: {raw}')
                  if info.is_dir():
                      continue
                  if raw == 'AutoMesh.exe':
                      dest = Path('app/AutoMesh.exe')
                  elif raw.startswith('完整源码/'):
                      dest = Path('source') / Path(*rel.parts[1:])
                  elif raw == 'README.md':
                      continue
                  elif raw == 'R8.0_候选审核与增量发布说明.md':
                      dest = Path('docs/releases/R8.0_候选审核与增量发布说明.md')
                  elif raw == 'GITHUB_UPLOAD_GUIDE.md':
                      dest = Path('docs/archive/GITHUB_UPLOAD_GUIDE_initial_upload.md')
                  elif raw == 'SHA256.json':
                      dest = Path('releases/SHA256_original_archive_layout.json')
                  elif raw == 'Publish-AutoMesh-GitHub.ps1':
                      dest = Path('tools/legacy/Publish-AutoMesh-GitHub.ps1')
                  elif raw in ('.gitignore', '.gitattributes'):
                      dest = Path(raw)
                  elif raw.startswith('releases/'):
                      dest = Path(raw)
                  else:
                      dest = Path('package') / Path(*rel.parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(info, 'r') as src, dest.open('wb') as out:
                      shutil.copyfileobj(src, out)
                  extracted += 1
          
          archive_copy = Path('releases/archives/AutoMesh_R8_0_GitHub_Ready.zip')
          archive_copy.parent.mkdir(parents=True, exist_ok=True)
          shutil.move(str(archive), str(archive_copy))
          
          readme_lines = [
              '# AutoMesh R8.0',
              '',
              'ANSYS Meshing 网格质量检查与局部细化工具。',
              '',
              '## 仓库结构',
              '',
              '| 目录/文件 | 内容 |',
              '|---|---|',
              '| `app/` | Windows x64 可执行程序 `AutoMesh.exe` |',
              '| `source/` | Go 主程序、Python/ANSYS Worker、自动化脚本、测试与历史技术记录 |',
              '| `docs/` | R8.0 发布说明及上传归档文档 |',
              '| `releases/` | 集成发布包、原始 ZIP 及原始校验清单 |',
              '| `tools/legacy/` | 首次发布时使用的历史上传脚本 |',
              '| `SHA256SUMS.txt` | 当前整理后仓库文件的 SHA-256 校验清单 |',
              '',
              '## 下载与运行',
              '',
              '- Windows 程序：[`app/AutoMesh.exe`](app/AutoMesh.exe)',
              '- 原始集成发布包：[`releases/AutoMesh_R8_0_FullCandidate_ManualSizing_Integrated.zip`](releases/AutoMesh_R8_0_FullCandidate_ManualSizing_Integrated.zip)',
              '- 原始完整上传 ZIP：[`releases/archives/AutoMesh_R8_0_GitHub_Ready.zip`](releases/archives/AutoMesh_R8_0_GitHub_Ready.zip)',
              '- 发布说明：[`docs/releases/R8.0_候选审核与增量发布说明.md`](docs/releases/R8.0_候选审核与增量发布说明.md)',
              '',
              '## 源码测试',
              '',
              '在 Windows 开发环境进入 `source/` 后执行：',
              '',
              '```powershell',
              'go test ./...',
              'python -m pytest -q',
              '```',
              '',
              '测试结果应结合 ANSYS 2024 R2 / ACT 实际环境单独验收。代码级或模拟测试不等同于真实 Meshing Sizing 发布验收。',
              '',
              '## 安全边界',
              '',
              'AutoMesh 面向用户已经打开的 Workbench/Meshing 会话；不会为了测试而新建工程、自动重划网格或启动 Fluent。公开仓库不包含真实工程、ANSYS 许可文件或个人凭据。',
              '',
              '仓库未附带开源许可证，因此公开可见不代表授予他人任意再分发或修改的许可。',
          ]
          Path('README.md').write_text('\n'.join(readme_lines) + '\n', encoding='utf-8')
          
          checksum_file = Path('SHA256SUMS.txt')
          rows = []
          for p in sorted(Path('.').rglob('*')):
              if not p.is_file() or '.git' in p.parts or '.github' in p.parts or p == checksum_file:
                  continue
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append(f'{digest}  {p.as_posix()}')
          checksum_file.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          
          workflow = Path('.github/workflows/unpack-autmesh.yml')
          if workflow.exists():
              workflow.unlink()
          print(f'Unpacked {extracted} files from {archive_copy.name}.')
          print(f'Generated SHA256SUMS.txt with {len(rows)} entries.')
          PY

      - name: Commit organized repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Organize AutoMesh R8.0 source, app, docs and releases'
          git push origin HEAD:main