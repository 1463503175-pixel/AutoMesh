name: Import verified AutoMesh R8.1 RC
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-r81-rc.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: automesh-r81-import
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify ZIP and promote R8.1 sources and GUI EXE
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile, tempfile, shutil, stat, struct, json
          root = Path.cwd()
          archive_sha = "1fbd9bf31ffa3a991712bffe0ba4e6cbfb7e3ac309922c5f5dcd5adb58257260"
          sha = lambda b: hashlib.sha256(b).hexdigest()
          matched = [p for p in root.glob("AutoMesh_R8_1_RC_20261109_*.zip") if sha(p.read_bytes()) == archive_sha]
          if len(matched) != 1: raise RuntimeError("Verified R8.1 ZIP not uniquely found")
          archive = matched[0]
          with zipfile.ZipFile(archive) as z:
              if z.testzip() is not None: raise RuntimeError("ZIP CRC failure")
              names = z.namelist()
              if len(names) != 248: raise RuntimeError("Unexpected ZIP member count")
              for n in names:
                  p = PurePosixPath(n)
                  if not n or n.startswith("/") or "\\" in n or ".." in p.parts: raise RuntimeError("Unsafe ZIP path")
              prefix = names[0].split("/")[0] + "/"
              lines = z.read(prefix + "SHA256SUMS.txt").decode("utf8").splitlines()
              manifest = dict(line.split("  ", 1)[::-1] for line in lines)
              if len(manifest) != 247: raise RuntimeError("Unexpected manifest count")
              if set(manifest) != {n[len(prefix):] for n in names if n != prefix+"SHA256SUMS.txt"}: raise RuntimeError("Manifest mismatch")
              for rel,h in manifest.items():
                  if sha(z.read(prefix+rel)) != h: raise RuntimeError("SHA mismatch: " + rel)
              exe = z.read(prefix+"AutoMesh.exe")
              pe = struct.unpack_from("<I",exe,0x3c)[0]
              if exe[pe:pe+4] != b"PE\x00\x00" or struct.unpack_from("<H",exe,pe+24+68)[0] != 2: raise RuntimeError("Not a Windows GUI EXE")
              source_data = {}
              for rel in manifest:
                  if not rel.startswith("完整源码/"): continue
                  p = rel[len("完整源码/"):]
                  if "__pycache__" in PurePosixPath(p).parts or p.endswith((".pyc",".pyo")): continue
                  source_data[p] = z.read(prefix+rel)
              assert {"go.mod","main_windows.go","core.go","assets/meshing_worker.py"}.issubset(source_data)
              checkpoint = z.read(prefix+"检查点.md")
          with tempfile.TemporaryDirectory(prefix=".r81_stage_",dir=root) as d:
              staged = Path(d)/"source"
              for rel,data in source_data.items():
                  dest = staged.joinpath(*PurePosixPath(rel).parts)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(data)
              target = root/"source"
              if target.exists(): shutil.rmtree(target)
              shutil.copytree(staged,target)
          (root/"app").mkdir(exist_ok=True)
          (root/"app/AutoMesh.exe").write_bytes(exe)
          notes = root/"docs/releases"
          notes.mkdir(parents=True,exist_ok=True)
          (notes/"R8.1_RC_20261109_质量数据与手动出入口Sizing_检查点.md").write_bytes(checkpoint)
          summary={"version":"R8.1 RC 2026-11-09","archive":archive.name,"archive_sha256":archive_sha,"archive_entries":len(names),"verified_manifest_entries":len(manifest),"promoted_source_files":len(source_data),"excluded_python_caches":sum(1 for p in manifest if "__pycache__" in p or p.endswith((".pyc",".pyo"))),"exe_bytes":len(exe),"exe_sha256":sha(exe),"windows_gui_subsystem":2,"ansys_live_validation":"PENDING","legacy_releases_preserved":True}
          (notes/"R8.1_RC_20261109_导入核验.json").write_text(json.dumps(summary,indent=2,ensure_ascii=False)+"\n",encoding="utf8")
          manifest_lines = []
          for p in sorted(root.rglob("*")):
              if not p.is_file() or ".git" in p.parts or p.name=="SHA256SUMS.txt": continue
              if "__pycache__" in p.parts or ".pytest_cache" in p.parts: continue
              manifest_lines.append(sha(p.read_bytes())+"  "+p.relative_to(root).as_posix())
          (root/"SHA256SUMS.txt").write_text("\n".join(manifest_lines)+"\n",encoding="utf8")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Commit promoted R8.1 artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source app docs/releases SHA256SUMS.txt
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'Promote verified AutoMesh R8.1 RC from uploaded source ZIP'
          git push
